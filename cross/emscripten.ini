[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
pkg-config = 'pkg-config'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[built-in options]
c_args = ['-sUSE_GLFW=3', '-sASYNCIFY']
c_link_args = [
  '-sUSE_GLFW=3',
  '-sASYNCIFY',
  '-sTOTAL_MEMORY=67108864',
  '-lidbfs.js']
